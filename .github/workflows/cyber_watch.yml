name: Veille cybersécurité

on:
  schedule:
    # Toutes les 20 minutes environ (minutes décalées pour éviter les heures de pointe)
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Un seul passage à la fois, sinon les doublons reviennent
concurrency:
  group: cyber-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # L'historique des éléments déjà envoyés vit sur la branche "state".
      # Chaque passage pousse aussi sur cette branche, ce qui évite la
      # désactivation des workflows planifiés après 60 jours sans activité.
      - name: Charger l'état
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch state "$url" state
          else
            mkdir state
            git -C state init --quiet -b state
            git -C state remote add origin "$url"
          fi

      - name: Lancer la veille
        env:
          TELEGRAM_BOT_TOKEN_WATCH: ${{ secrets.TELEGRAM_BOT_TOKEN_WATCH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_WATCH: ${{ secrets.TELEGRAM_CHAT_ID_WATCH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cyber_watch.py

      - name: Sauvegarder l'état
        if: always()
        run: |
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            msg="state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git rev-parse --verify HEAD >/dev/null 2>&1; then
              git commit --quiet --amend -m "$msg"
            else
              git commit --quiet -m "$msg"
            fi
            git push --quiet --force origin state
          fi
