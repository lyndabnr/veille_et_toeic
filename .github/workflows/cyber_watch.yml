name: Cybersecurity News Watch

on:
  schedule:
    # Runs daily around 09:00 AM Paris Time (scheduled at 06:52 UTC to avoid peak-hour queue delay)
    - cron: '52 6 * * *'
    # Runs daily around 11:05 PM Paris Time (scheduled at 21:02 UTC to avoid peak-hour queue delay)
    - cron: '2 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Cyber Watch Bot
        env:
          TELEGRAM_BOT_TOKEN_WATCH: ${{ secrets.TELEGRAM_BOT_TOKEN_WATCH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_WATCH: ${{ secrets.TELEGRAM_CHAT_ID_WATCH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python security_audit.py --fetch-news

      # GitHub désactive les workflows planifiés après 60 jours sans activité
      # sur le dépôt. Un commit mensuel évite la désactivation.
      - name: Keepalive commit (every 30 days)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive"
            git push
          fi
